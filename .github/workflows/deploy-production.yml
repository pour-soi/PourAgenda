name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from origin/main to deploy
        required: true
        type: string
      mode:
        description: Validation builds do not deploy or access production secrets
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - build-only

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-custom-worker:
    if: inputs.mode == 'build-only'
    name: Validate custom Worker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Verify selected snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked source for credentials
        run: pnpm run scan:credentials

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run notification infrastructure tests
        run: >-
          pnpm exec vitest run
          src/lib/personal-appointment-reminders.test.ts
          src/lib/push-dispatch.test.ts
          src/lib/service-worker-push.test.ts

      - name: Generate build-only Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('wrangler.example.jsonc', 'utf8');
          const output = source.replace('your-pouragenda-worker', 'pouragenda-build-validation');
          if (output === source) throw new Error('Worker-name placeholder was not found');
          if (!output.includes('"main": "custom-worker.ts"')) throw new Error('custom-worker.ts is not configured');
          if (!output.includes('"crons": ["*/5 * * * *"]')) throw new Error('Expected Cron configuration is missing');
          fs.writeFileSync('wrangler.jsonc', output, { mode: 0o600 });
          NODE

      - name: Build OpenNext Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic_publishable_build_only
        run: pnpm exec opennextjs-cloudflare build

      - name: Bundle custom Worker without deploying
        run: pnpm exec wrangler deploy --dry-run --outdir .validation-worker

      - name: Verify Worker entry points and client isolation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function filesUnder(root) {
            if (!fs.existsSync(root)) return [];
            return fs.readdirSync(root, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(root, entry.name);
              return entry.isDirectory() ? filesUnder(target) : [target];
            });
          }

          const source = fs.readFileSync('custom-worker.ts', 'utf8');
          if (!/fetch\s*\(/.test(source)) throw new Error('Custom Worker fetch handler is missing');
          if (!/scheduled\s*\(/.test(source)) throw new Error('Custom Worker scheduled handler is missing');

          const workerFiles = filesUnder('.validation-worker').filter((file) => /\.(?:js|mjs)$/.test(file));
          const workerBundle = workerFiles.map((file) => fs.readFileSync(file, 'utf8')).join('\n');
          if (!workerBundle) throw new Error('Wrangler did not produce a Worker bundle');
          if (!workerBundle.includes('scheduled')) throw new Error('Bundled scheduled handler was not found');
          if (!workerBundle.includes('fetch')) throw new Error('Bundled fetch handler was not found');

          const clientFiles = [
            ...filesUnder('.next/static'),
            ...filesUnder('.open-next/assets/_next/static'),
          ].filter((file) => /\.(?:js|mjs|css|html|json|map)$/.test(file));
          const forbidden = ['SUPABASE_SERVICE_ROLE_KEY', 'VAPID_PRIVATE_KEY'];
          for (const file of clientFiles) {
            const content = fs.readFileSync(file, 'utf8');
            for (const name of forbidden) {
              if (content.includes(name)) throw new Error(`${name} leaked into client output: ${file}`);
            }
          }
          NODE

      - name: Validate migration safety structure
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sql = fs.readFileSync('supabase/migrations/202608170001_personal_appointment_push.sql', 'utf8');
          const required = [
            /enable row level security/i,
            /push_subscriptions/i,
            /personal_appointment_push_deliveries/i,
            /unique/i,
          ];
          for (const pattern of required) {
            if (!pattern.test(sql)) throw new Error(`Migration structure missing ${pattern}`);
          }
          NODE

      - name: Remove temporary validation files
        if: always()
        run: rm -rf wrangler.jsonc .validation-worker

  deploy:
    if: inputs.mode != 'build-only'
    name: Deploy approved commit
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify selected commit is current main
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character Git commit SHA."
            exit 1
          fi

          actual_commit="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" || "$actual_commit" != "$remote_main" ]]; then
            echo "::error::The selected commit must exactly match current origin/main."
            exit 1
          fi

          echo "Deploying verified origin/main commit $actual_commit"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked source for credentials
        run: pnpm run scan:credentials

      - name: Validate production deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_NAME NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY PRODUCTION_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production environment secret $name is missing."
              exit 1
            fi
          done

          if [[ ! "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https://[^/]+\.supabase\.co/?$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL must be an HTTPS supabase.co project URL."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_URL" == *localhost* || "$NEXT_PUBLIC_SUPABASE_URL" == *127.0.0.1* ]]; then
            echo "::error::Local Supabase endpoints cannot be used for production deployment."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::The frontend key must be a Supabase publishable key."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == sb_secret_* || "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == *service_role* ]]; then
            echo "::error::Secret and service-role keys are forbidden in the frontend build."
            exit 1
          fi
          if [[ ! "$PRODUCTION_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "::error::PRODUCTION_URL must be an HTTPS origin without a path."
            exit 1
          fi

      - name: Generate ephemeral production Wrangler configuration
        env:
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const templatePath = "wrangler.example.jsonc";
          const outputPath = "wrangler.jsonc";
          const marker = '"your-pouragenda-worker"';
          const template = fs.readFileSync(templatePath, "utf8");
          const occurrences = template.split(marker).length - 1;

          if (occurrences !== 1) {
            throw new Error("Wrangler template must contain exactly one Worker-name placeholder.");
          }

          const workerName = process.env.CLOUDFLARE_WORKER_NAME;
          if (!workerName) {
            throw new Error("CLOUDFLARE_WORKER_NAME is missing.");
          }

          fs.writeFileSync(outputPath, template.replace(marker, JSON.stringify(workerName)), {
            mode: 0o600,
          });
          NODE

          git check-ignore --quiet wrangler.jsonc
          test "$(stat -c '%a' wrangler.jsonc)" = "600"

      - name: Build and deploy existing production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm deploy

      - name: Smoke-check production routes
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          base_url="${PRODUCTION_URL%/}"
          for path in / /login /manifest.webmanifest /sw.js; do
            status=""
            for attempt in {1..12}; do
              status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$base_url$path")"
              if [[ "$status" == "200" ]]; then
                break
              fi
              sleep 5
            done

            if [[ "$status" != "200" ]]; then
              echo "::error::Production smoke check failed for $path with HTTP $status."
              exit 1
            fi
            echo "$path: HTTP 200"
          done

      - name: Remove ephemeral Wrangler configuration
        if: always()
        run: rm -f wrangler.jsonc
