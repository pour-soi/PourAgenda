name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from origin/main to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved commit
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify selected commit is current main
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character Git commit SHA."
            exit 1
          fi

          actual_commit="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" || "$actual_commit" != "$remote_main" ]]; then
            echo "::error::The selected commit must exactly match current origin/main."
            exit 1
          fi

          echo "Deploying verified origin/main commit $actual_commit"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked source for credentials
        run: pnpm run scan:credentials

      - name: Validate production deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_NAME NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY PRODUCTION_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production environment secret $name is missing."
              exit 1
            fi
          done

          if [[ ! "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https://[^/]+\.supabase\.co/?$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL must be an HTTPS supabase.co project URL."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_URL" == *localhost* || "$NEXT_PUBLIC_SUPABASE_URL" == *127.0.0.1* ]]; then
            echo "::error::Local Supabase endpoints cannot be used for production deployment."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::The frontend key must be a Supabase publishable key."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == sb_secret_* || "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == *service_role* ]]; then
            echo "::error::Secret and service-role keys are forbidden in the frontend build."
            exit 1
          fi
          if [[ ! "$PRODUCTION_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "::error::PRODUCTION_URL must be an HTTPS origin without a path."
            exit 1
          fi

      - name: Generate ephemeral production Wrangler configuration
        env:
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const templatePath = "wrangler.example.jsonc";
          const outputPath = "wrangler.jsonc";
          const marker = '"your-pouragenda-worker"';
          const template = fs.readFileSync(templatePath, "utf8");
          const occurrences = template.split(marker).length - 1;

          if (occurrences !== 1) {
            throw new Error("Wrangler template must contain exactly one Worker-name placeholder.");
          }

          const workerName = process.env.CLOUDFLARE_WORKER_NAME;
          if (!workerName) {
            throw new Error("CLOUDFLARE_WORKER_NAME is missing.");
          }

          fs.writeFileSync(outputPath, template.replace(marker, JSON.stringify(workerName)), {
            mode: 0o600,
          });
          NODE

          git check-ignore --quiet wrangler.jsonc
          test "$(stat -c '%a' wrangler.jsonc)" = "600"

      - name: Build and deploy existing production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm deploy

      - name: Smoke-check production routes
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          base_url="${PRODUCTION_URL%/}"
          for path in / /login /manifest.webmanifest /sw.js; do
            status=""
            for attempt in {1..12}; do
              status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$base_url$path")"
              if [[ "$status" == "200" ]]; then
                break
              fi
              sleep 5
            done

            if [[ "$status" != "200" ]]; then
              echo "::error::Production smoke check failed for $path with HTTP $status."
              exit 1
            fi
            echo "$path: HTTP 200"
          done

      - name: Remove ephemeral Wrangler configuration
        if: always()
        run: rm -f wrangler.jsonc
