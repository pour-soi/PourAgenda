name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from origin/main to deploy
        required: true
        type: string
      mode:
        description: Validate the custom Worker without deploying, or deploy Production
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - deploy

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-custom-worker:
    name: Validate custom OpenNext Worker
    if: inputs.mode == 'build-only'
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify selected commit is current main
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character Git commit SHA."
            exit 1
          fi
          actual_commit="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" || "$actual_commit" != "$remote_main" ]]; then
            echo "::error::The selected commit must exactly match current origin/main."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and focused notification behavior
        run: |
          pnpm run scan:credentials
          pnpm typecheck
          pnpm lint
          pnpm exec vitest run \
            src/lib/personal-appointment-reminders.test.ts \
            src/lib/push-dispatch.test.ts \
            src/lib/push-subscription.test.ts \
            src/lib/service-worker-push.test.ts \
            src/lib/notification-deep-link.test.ts \
            src/lib/settings-push.test.ts \
            src/lib/push-migration.test.ts

      - name: Generate ephemeral build-validation Wrangler configuration
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const template = fs.readFileSync("wrangler.example.jsonc", "utf8");
          const marker = '"your-pouragenda-worker"';
          if (template.split(marker).length - 1 !== 1) {
            throw new Error("Wrangler template must contain exactly one Worker-name placeholder.");
          }
          fs.writeFileSync(
            "wrangler.jsonc",
            template.replace(marker, '"pouragenda-build-validation"'),
            { mode: 0o600 },
          );
          NODE
          git check-ignore --quiet wrangler.jsonc
          node -e 'const fs=require("node:fs"); const c=fs.readFileSync("wrangler.jsonc","utf8"); if(!c.includes("custom-worker.ts") || !c.includes("*/5 * * * *")) process.exit(1)'

      - name: Build and dry-run bundle custom Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          pnpm exec opennextjs-cloudflare build
          pnpm exec wrangler deploy --dry-run --outdir .validation-worker

      - name: Verify Worker entry points, secret boundary, Cron, and migration
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const source = fs.readFileSync("custom-worker.ts", "utf8");
          if (!source.includes("fetch: handler.fetch") || !source.includes("async scheduled(")) {
            throw new Error("Custom Worker must preserve fetch and scheduled entry points.");
          }

          const config = fs.readFileSync("wrangler.jsonc", "utf8");
          if (!config.includes('"main": "custom-worker.ts"') || !config.includes('"crons": ["*/5 * * * *"]')) {
            throw new Error("Custom Worker or Cron configuration is missing.");
          }

          const walk = (root) => fs.existsSync(root)
            ? fs.readdirSync(root, { withFileTypes: true }).flatMap((entry) => {
                const item = path.join(root, entry.name);
                return entry.isDirectory() ? walk(item) : [item];
              })
            : [];
          const workerText = walk(".validation-worker")
            .filter((file) => /\.(?:js|mjs)$/.test(file))
            .map((file) => fs.readFileSync(file, "utf8"))
            .join("\n");
          if (!workerText.includes("scheduled") || !workerText.includes("fetch")) {
            throw new Error("Dry-run Worker bundle does not expose both handlers.");
          }

          const browserText = [...walk(".next/static"), ...walk(".open-next/assets")]
            .filter((file) => /\.(?:js|mjs|html|css|json)$/.test(file))
            .map((file) => fs.readFileSync(file, "utf8"))
            .join("\n");
          for (const serverOnlyName of ["SUPABASE_SERVICE_ROLE_KEY", "VAPID_PRIVATE_KEY"]) {
            if (browserText.includes(serverOnlyName)) {
              throw new Error(`${serverOnlyName} leaked into browser output.`);
            }
          }

          const migration = fs.readFileSync("supabase/migrations/202608170001_personal_appointment_push.sql", "utf8");
          for (const required of [
            "create table public.push_subscriptions",
            "create table public.push_reminder_deliveries",
            "unique (subscription_id, slot_key)",
            "attempt_count between 0 and 3",
            "interval '15 minutes'",
            "grant execute on function public.claim_push_reminder_delivery",
          ]) {
            if (!migration.toLowerCase().includes(required.toLowerCase())) {
              throw new Error(`Migration requirement missing: ${required}`);
            }
          }
          NODE

      - name: Remove ephemeral validation output
        if: always()
        run: rm -rf wrangler.jsonc .validation-worker .next .open-next

  deploy:
    name: Deploy approved commit
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify selected commit is current main
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character Git commit SHA."
            exit 1
          fi

          actual_commit="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" || "$actual_commit" != "$remote_main" ]]; then
            echo "::error::The selected commit must exactly match current origin/main."
            exit 1
          fi

          echo "Deploying verified origin/main commit $actual_commit"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked source for credentials
        run: pnpm run scan:credentials

      - name: Validate production deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_WORKER_NAME NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY PRODUCTION_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production environment secret $name is missing."
              exit 1
            fi
          done

          if [[ ! "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https://[^/]+\.supabase\.co/?$ ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL must be an HTTPS supabase.co project URL."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_URL" == *localhost* || "$NEXT_PUBLIC_SUPABASE_URL" == *127.0.0.1* ]]; then
            echo "::error::Local Supabase endpoints cannot be used for production deployment."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::The frontend key must be a Supabase publishable key."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == sb_secret_* || "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" == *service_role* ]]; then
            echo "::error::Secret and service-role keys are forbidden in the frontend build."
            exit 1
          fi
          if [[ ! "$PRODUCTION_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "::error::PRODUCTION_URL must be an HTTPS origin without a path."
            exit 1
          fi

      - name: Generate ephemeral production Wrangler configuration
        env:
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const templatePath = "wrangler.example.jsonc";
          const outputPath = "wrangler.jsonc";
          const marker = '"your-pouragenda-worker"';
          const template = fs.readFileSync(templatePath, "utf8");
          const occurrences = template.split(marker).length - 1;

          if (occurrences !== 1) {
            throw new Error("Wrangler template must contain exactly one Worker-name placeholder.");
          }

          const workerName = process.env.CLOUDFLARE_WORKER_NAME;
          if (!workerName) {
            throw new Error("CLOUDFLARE_WORKER_NAME is missing.");
          }

          fs.writeFileSync(outputPath, template.replace(marker, JSON.stringify(workerName)), {
            mode: 0o600,
          });
          NODE

          git check-ignore --quiet wrangler.jsonc
          test "$(stat -c '%a' wrangler.jsonc)" = "600"

      - name: Build and deploy existing production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm deploy

      - name: Smoke-check production routes
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          base_url="${PRODUCTION_URL%/}"
          for path in / /login /manifest.webmanifest /sw.js; do
            status=""
            for attempt in {1..12}; do
              status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$base_url$path")"
              if [[ "$status" == "200" ]]; then
                break
              fi
              sleep 5
            done

            if [[ "$status" != "200" ]]; then
              echo "::error::Production smoke check failed for $path with HTTP $status."
              exit 1
            fi
            echo "$path: HTTP 200"
          done

      - name: Remove ephemeral Wrangler configuration
        if: always()
        run: rm -f wrangler.jsonc
